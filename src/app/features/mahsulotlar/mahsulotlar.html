<div>
  <input [(ngModel)]="qidiruv" (ngModelChange)="qidirish()" placeholder="Mahsulot qidirish..." />
</div>

@if (mahsulotService.yuklanyapti()) {
  <app-loading></app-loading>
} @else {
  @for (mahsulot of mahsulotService.mahsulotlar(); track mahsulot.id) {
    <app-mahsulot-card
      [mahsulot]="mahsulot"
      (savatgaQoshildi)="savatgaQosh($event)"
      (detailKorildi)="detailKor($event)"
    >
    </app-mahsulot-card>
  } @empty {
    <p>Mahsulot topilmadi</p>
  }
}
